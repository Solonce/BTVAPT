interval_minutes = 180
expected_min = 0
enabled = false
disabled_reason = "adapter not built yet"

[sources.distinctive]
name = "Distinctive PM / Farrell Gardens"
platform = "appfolio"
robots_override = true
base_url = ""  # TODO: find AppFolio subdomain
