# ---- Private landlords ----

[sources.craigslist]
name = "Craigslist"
platform = "craigslist"
area = "burlington"
postal = "05401"
search_distance = 12  # miles
default_city = "Burlington"
interval_minutes = 120
expected_min = 20

# Listings you send from Facebook/anywhere via the bookmarklet or Add page.
[sources.manual]
name = "Saved by me"
platform = "manual"
interval_minutes = 1440
expected_min = 0

# Emails (Facebook notifications, Front Porch Forum digests, alerts) read
# from the inbox configured in btv.toml [inbox]; see README.
[sources.email]
name = "Email inbox"
platform = "email"
interval_minutes = 1440
expected_min = 0

# Redstone's listings (Yardi RentCafe) sit behind a Cloudflare browser
