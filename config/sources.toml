# Source definitions. `btv sources sync` loads this into the DB.
# Keys under a source other than the standard columns are passed to the
# platform adapter as its config.
#
# Standard columns: name, platform, interval_minutes, expected_min,
# expected_max, enabled (initial kill-switch state), disabled_reason.
#
# robots_override = true skips robots.txt for that source. AppFolio's
# robots.txt disallows everything; by explicit decision (2026-09-30) we fetch
# only the public listing pages at a low rate for AppFolio sources.
#

[sources.fiveseasons]
name = "Five Seasons Property Management"
# Five Seasons disabled Buildium's public listings page; their own site
# (Nesthub, fed from Buildium) exposes the same listings as JSON.
platform = "nesthub"
base_url = "https://www.burlingtonproperty.management"
interval_minutes = 180
expected_min = 1

[sources.hinsdale]
name = "Hinsdale Properties"
platform = "buildium"
base_url = "https://hinsdaleproperties.managebuilding.com"
interval_minutes = 180
expected_min = 1

[sources.stonebrown]
name = "Stone & Browning Property Management"
platform = "appfolio"
robots_override = true
base_url = "https://stonebrown.appfolio.com"
interval_minutes = 180
expected_min = 1

[sources.fpmvt]
name = "Fusion Property Management"
platform = "appfolio"
