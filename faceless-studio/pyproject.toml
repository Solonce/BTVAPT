[project]
name = "faceless-studio"
version = "0.1.0"
description = "Self-driving faceless video generator with a web UI"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70",
    "edge-tts>=7.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pillow>=10.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
studio = "studio.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studio"]
