<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BTV Rentals</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231d6b57'/><path d='M8 24V13l8-6 8 6v11h-6v-6h-4v6z' fill='white'/></svg>">
<!-- Leaflet + markercluster are vendored so the app works without third-party CDNs; only map tiles load live. -->
<link rel="stylesheet" href="/static/vendor/leaflet/leaflet.min.css">
<link rel="stylesheet" href="/static/vendor/markercluster/MarkerCluster.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/explore">
    <span class="mark"><svg viewBox="0 0 24 24"><path d="M4 20V10l8-6 8 6v10h-5v-5h-6v5z"/></svg></span>
    <span class="txt">BTV Rentals</span>
  </a>
  <nav class="nav">
    <a href="#/explore" data-tab="explore"><span class="lbl">Explore</span></a>
    <a href="#/inbox" data-tab="inbox"><span class="lbl">Inbox</span><span class="count hidden" id="inboxCount"></span></a>
    <a href="#/people" data-tab="people"><span class="lbl">People</span></a>
    <a href="#/health" data-tab="health"><span class="dot" id="healthDot"></span><span class="lbl">Health</span></a>
  </nav>
  <div class="movein">
    <button class="movein-btn" id="moveinBtn" title="Target move-in date (view setting only)">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span class="lbl">Move in</span> <b id="moveinLabel">—</b>
    </button>
  </div>
</header>

<main id="view"></main>
<aside class="drawer" id="drawer" aria-live="polite"></aside>
<script src="/static/vendor/leaflet/leaflet.min.js"></script>
<script src="/static/vendor/markercluster/leaflet.markercluster.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
