<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BTV Apartments</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232f5d50'/><path d='M8 24V13l8-6 8 6v11h-6v-6h-4v6z' fill='white'/></svg>">
<!-- Leaflet 1.9.4 is vendored so the app works without third-party CDNs; only map tiles are fetched live. -->
<link rel="stylesheet" href="/static/vendor/leaflet/leaflet.min.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="dot"></span><span class="txt">BTV Apartments</span></div>
  <nav class="tabs">
    <a href="#/map" data-tab="map">Map</a>
    <a href="#/contacts" data-tab="contacts">Contacts</a>
    <a href="#/health" data-tab="health"><span class="health-dot" id="healthDot"></span>&nbsp;Health</a>
  </nav>
  <div class="target">
    <label for="targetDate">Move-in</label>
    <input type="date" id="targetDate" title="Target move-in date">
    <span>±</span>
    <input type="number" id="windowDays" min="0" max="365" title="Near-miss window (days)">
    <span>d</span>
  </div>
</header>

<main id="view"></main>
<aside class="drawer" id="drawer" aria-live="polite"></aside>
<script src="/static/vendor/leaflet/leaflet.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
